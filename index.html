<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アニメカタログ</title>
<!-- ファビコン：ポスターの壁を4枚のタイルで。色は区分の印と揃えてある
     🟥新番組 / 🟦放送中 / 🟨劇場 / 💗みたい -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0d10'/%3E%3Crect x='5' y='5' width='9.5' height='10' rx='1.6' fill='%23ff3355'/%3E%3Crect x='17.5' y='5' width='9.5' height='10' rx='1.6' fill='%233399ff'/%3E%3Crect x='5' y='17' width='9.5' height='10' rx='1.6' fill='%23ffcc00'/%3E%3Crect x='17.5' y='17' width='9.5' height='10' rx='1.6' fill='%23241820'/%3E%3Cpath d='M22.25 25.4c-2.6-1.9-4.1-3.2-4.1-4.9 0-1.3 1-2.3 2.2-2.3.8 0 1.5.4 1.9 1 .4-.6 1.1-1 1.9-1 1.2 0 2.2 1 2.2 2.3 0 1.7-1.5 3-4.1 4.9z' fill='%23ff5a7c'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0d0d10; --panel:#17171c; --line:#2a2a33;
    --fg:#f2f2f5; --dim:#8b8b98; --accent:#ff3355;
    --new:#ff3355; --airing:#3399ff; --gold:#ffc300;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; padding-bottom:4rem;
  }
  body.locked{overflow:hidden}
  a{color:inherit}

  /* ───────── 上のバー ───────── */
  header{
    position:sticky; top:0; z-index:20;
    background:rgba(13,13,16,.92); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .head-row{display:flex; align-items:baseline; gap:.75rem; padding:.9rem 1rem .5rem}
  h1{font-size:1.05rem; letter-spacing:.04em; font-weight:700}
  .meta{font-size:.72rem; color:var(--dim); margin-left:auto; text-align:right; line-height:1.4}

  .filters{display:flex; flex-wrap:wrap; gap:.4rem; padding:0 1rem .75rem}
  .grp{display:flex; gap:.25rem; background:var(--panel); border-radius:99px; padding:.2rem}
  .grp button{
    font:inherit; font-size:.78rem; color:var(--dim); background:none; border:0;
    padding:.38rem .8rem; border-radius:99px; cursor:pointer; white-space:nowrap;
  }
  .grp button[aria-pressed="true"]{background:var(--fg); color:#111; font-weight:700}
  .toggle{
    font:inherit; font-size:.78rem; color:var(--dim); cursor:pointer;
    background:var(--panel); border:1px solid var(--line); border-radius:99px; padding:.42rem .85rem;
  }
  .toggle[aria-pressed="true"]{background:#123; border-color:#2a6; color:#7fe0a8; font-weight:700}
  .toggle.heart[aria-pressed="true"]{background:#2a0d15; border-color:#a3324c; color:#ff7f9c}

  /* ───────── 📚 棚（利用者の案・2026-09-01）─────────
     「タグでページごと分けてもいいかもしれません」
     ★帯を3つ重ねたら「何が主役かわからなくなった」（利用者）。
       芯は『ポスターの壁が主役。好みは順番に使い、絞り込みには使わない』だった。
       → 帯をやめる。棚を選ぶと、その棚の作品が壁いっぱいに出る。入口は1つ。 */
  .shelves{
    display:flex; gap:.4rem; overflow-x:auto; padding:.15rem 1rem .7rem;
    -webkit-overflow-scrolling:touch; scrollbar-width:thin;
  }
  .shelves::-webkit-scrollbar{height:4px}
  .shelves::-webkit-scrollbar-thumb{background:#33333d; border-radius:9px}
  .shelf{
    flex:0 0 auto; font:inherit; font-size:.76rem; cursor:pointer; white-space:nowrap;
    padding:.42rem .85rem; border-radius:99px; color:var(--dim);
    background:var(--panel); border:1px solid var(--line);
  }
  .shelf[aria-pressed="true"]{background:var(--fg); border-color:var(--fg); color:#111; font-weight:800}
  .shelf small{opacity:.65; margin-left:.3rem; font-weight:400}
  .shelf.grp{
    background:none; border:0; color:#55555f; cursor:default; padding:.42rem .2rem;
    font-size:.66rem; letter-spacing:.08em;
  }
  .shelf.sp[aria-pressed="false"]{border-color:#4a4550; color:#b9a9c9}
  .shelfnote{font-size:.7rem; color:var(--dim); padding:0 1rem .6rem; line-height:1.6}

  /* ───────── （旧）おすすめの帯 ─────────
     ★利用者の指定：「一覧の上に帯で出す」。見回す楽しみ（248本）は下にそのまま残す。 */
  .bands{padding:.4rem 0 0}
  .band{margin-bottom:.9rem}
  .band h2{
    font-size:.85rem; font-weight:800; padding:.55rem 1rem .45rem;
    display:flex; align-items:baseline; gap:.5rem;
  }
  .band h2 small{font-size:.68rem; font-weight:500; color:var(--dim)}
  /* ★帯ごとに「続けて観る」 ─ 利用者の指摘 */
  .bandplay{
    margin-left:auto; font:inherit; font-size:.7rem; font-weight:800; cursor:pointer;
    padding:.32rem .7rem; border-radius:99px; white-space:nowrap;
    background:#2a0d15; border:1px solid #a3324c; color:#ff9fb5;
  }
  .bandplay:hover{background:var(--accent); border-color:var(--accent); color:#fff}
  .band .row{
    display:flex; gap:.6rem; overflow-x:auto; padding:0 1rem .35rem;
    scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch;
  }
  .band .row::-webkit-scrollbar{height:5px}
  .band .row::-webkit-scrollbar-thumb{background:#33333d; border-radius:9px}
  .bcard{flex:0 0 116px; cursor:pointer; scroll-snap-align:start}
  .bcard .shot{aspect-ratio:2/3; border-radius:8px}
  .bcard .why{
    font-size:.63rem; line-height:1.4; color:#b9b9c6; margin-top:.32rem;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  .bcard .bt{
    font-size:.7rem; font-weight:700; margin-top:.28rem; line-height:1.3;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .score{
    position:absolute; top:.3rem; left:.3rem; font-size:.6rem; font-weight:800;
    background:rgba(0,0,0,.72); color:#ffd166; padding:.15rem .35rem; border-radius:5px;
    backdrop-filter:blur(3px);
  }
  .band.new h2{color:#5eead4}
  .band.mov h2{color:#ffcc00}
  .band.soon h2{color:#a78bfa}
  .band.seq h2{color:#ff8a5c}
  .band.rec h2{color:#ffd166}

  /* まだ好みを教わっていないときの誘い */
  .invite{
    margin:.8rem 1rem 0; padding:1rem 1.1rem; border-radius:12px;
    background:linear-gradient(135deg,#1b1520,#141a20); border:1px solid #33303d;
  }
  .invite b{font-size:.9rem}
  .invite p{font-size:.76rem; color:var(--dim); line-height:1.8; margin-top:.35rem}
  .invite button{
    margin-top:.75rem; font:inherit; font-size:.82rem; font-weight:800; cursor:pointer;
    padding:.6rem 1.2rem; border-radius:99px; border:0; background:var(--gold); color:#221a00;
  }

  /* ───────── 好みを教える画面（ポスターをタップ）───────── */
  .teach{position:fixed; inset:0; z-index:50; background:var(--bg); overflow-y:auto; padding-bottom:6rem}
  .teach header{position:sticky; top:0; padding:1rem}
  .teach h2{font-size:1rem; font-weight:800}
  .teach p{font-size:.76rem; color:var(--dim); line-height:1.75; margin-top:.35rem}
  .tgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:.6rem; padding:1rem}
  @media(min-width:520px){ .tgrid{grid-template-columns:repeat(4,1fr)} }
  @media(min-width:760px){ .tgrid{grid-template-columns:repeat(6,1fr)} }
  @media(min-width:1100px){ .tgrid{grid-template-columns:repeat(8,1fr)} }
  .tcard{scroll-margin-top:6rem; cursor:pointer; position:relative; border-radius:9px; overflow:hidden; aspect-ratio:2/3; background:#22222a}
  .tcard img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .12s, filter .12s}
  .tcard .yr{
    position:absolute; left:0; bottom:0; right:0; font-size:.58rem; color:#ddd;
    background:linear-gradient(transparent,rgba(0,0,0,.9)); padding:1rem .3rem .22rem;
  }
  .tcard[aria-pressed="true"]{outline:3px solid var(--gold); outline-offset:-3px}
  .tcard[aria-pressed="true"] img{filter:brightness(1.08) saturate(1.15)}
  .tcard .tick{
    position:absolute; top:.3rem; right:.3rem; width:1.4rem; height:1.4rem; border-radius:50%;
    background:var(--gold); color:#221a00; font-size:.8rem; font-weight:900;
    display:none; place-items:center;
  }
  .tcard[aria-pressed="true"] .tick{display:grid}
  .tbar{
    position:fixed; left:0; right:0; bottom:0; z-index:51; display:flex; gap:.6rem; justify-content:center;
    background:rgba(13,13,16,.96); backdrop-filter:blur(10px); border-top:1px solid var(--line); padding:.8rem 1rem;
  }
  .tbar button{
    font:inherit; font-size:.85rem; font-weight:800; cursor:pointer;
    padding:.7rem 1.2rem; border-radius:99px; border:1px solid var(--line);
    background:#101015; color:var(--fg);
  }
  .tbar button.primary{background:var(--gold); border-color:var(--gold); color:#221a00}
  .tbar button:disabled{opacity:.45; cursor:default}

  

/* ───────── 🎞 予告編タイム ─────────
     ★GBが出た場所。映画館の予告編タイムを、家で・メモが取れる状態で再現する。
       映画館は「1か月〜半年後に公開が決まったもの」が黙っていても次々流れてくる（利用者の指定）。
       おすすめは「探す」ではなく「流す順番」だけを決める。出会いは奪わない。 */
  .pvtime{
    position:fixed; inset:0; z-index:60; background:#000;
    display:flex; flex-direction:column;
  }
  .pvhead{
    display:flex; align-items:center; gap:.7rem; padding:.6rem .8rem;
    background:#0d0d10; border-bottom:1px solid var(--line); flex:0 0 auto;
  }
  .pvhead .pvclose{
    font:inherit; font-size:1rem; width:2.1rem; height:2.1rem; border-radius:50%;
    background:#22222a; color:var(--fg); border:0; cursor:pointer; display:grid; place-items:center;
  }
  .pvhead .pvclose:hover{background:var(--accent)}
  .pvcount{font-size:.78rem; font-weight:800}
  .pvorder{font-size:.68rem; color:var(--dim); margin-left:auto}
  .pvbar{height:2px; background:#22222a; flex:0 0 auto}
  .pvbar i{display:block; height:100%; background:var(--gold); transition:width .3s}

  .pvstage{position:relative; width:100%; aspect-ratio:16/9; background:#000; flex:0 0 auto}
  .pvstage iframe, .pvstage > div{position:absolute; inset:0; width:100%; height:100%; border:0}

  .pvbody{flex:1 1 auto; overflow-y:auto; padding:.9rem 1rem 1rem}
  .pvbody h2{font-size:1rem; font-weight:800; line-height:1.4}
  .pvline{font-size:.76rem; color:#c9c9d4; margin-top:.35rem}
  .pvline b{color:var(--fg)}
  .pvwhy{
    font-size:.74rem; color:#ffd166; margin-top:.5rem; line-height:1.6;
    background:#1c1808; border:1px solid #4a3d12; border-radius:8px; padding:.5rem .65rem;
  }
  .pvsvc{font-size:.76rem; margin-top:.5rem}
  .pvsvc .own{color:#8ee8b4; font-weight:700}
  .pvsvc .gek{color:#ffcc00; font-weight:800}
  .pvsvc .unk{color:#c9a86a}
  .pvskip{font-size:.72rem; color:var(--dim); margin-top:.6rem}

  .pvacts{
    flex:0 0 auto; display:grid; grid-template-columns:1fr 1fr; gap:.6rem;
    padding:.7rem 1rem calc(.9rem + env(safe-area-inset-bottom));
    background:#0d0d10; border-top:1px solid var(--line);
  }
  .pvacts button{
    font:inherit; font-size:.9rem; font-weight:800; cursor:pointer;
    padding:.85rem; border-radius:10px; border:1px solid var(--line);
    background:#17171c; color:var(--fg);
  }
  .pvacts button.like[aria-pressed="true"]{background:#2a0d15; border-color:#a3324c; color:#ff9fb5}
  .pvacts button.next{background:var(--accent); border-color:var(--accent); color:#fff}
  /* ★「興味ない」＝観なくても『違う』と言える唯一の手段（利用者の指摘） */
  .nope{
    display:block; width:calc(100% - 2rem); margin:0 1rem 1.4rem; padding:.7rem;
    font:inherit; font-size:.8rem; font-weight:700; cursor:pointer; border-radius:9px;
    background:none; border:1px dashed #4a4a55; color:var(--dim);
  }
  .nope:hover{border-color:#8a5a5a; color:#d99}
  .nope[aria-pressed="true"]{background:#241418; border:1px solid #7a4050; color:#e0a0b0}
  .pvacts.three{grid-template-columns:1fr 1fr 1fr}
  .pvacts button.nope2{font-size:.8rem}
  .pvacts button:hover{filter:brightness(1.15)}

  @media(min-width:900px){
    .pvtime:not(:fullscreen){flex-direction:row; flex-wrap:wrap; align-content:flex-start}
    .pvtime:not(:fullscreen) .pvhead,
    .pvtime:not(:fullscreen) .pvbar{width:100%}
    .pvtime:not(:fullscreen) .pvstage{flex:1 1 62%; aspect-ratio:16/9; max-width:64%}
    .pvtime:not(:fullscreen) .pvbody{flex:1 1 36%; max-height:none}
    .pvtime:not(:fullscreen) .pvacts{width:100%}
  }

  /* ───────── フルスクリーン＝映画館モード ─────────
     ★利用者の指定：「映画館のようにフルスクリーンにしてほしい」
       画面いっぱいに映像。文字は上下の薄い帯にどけて、絵の邪魔をしない。 */
  .pvtime:fullscreen{background:#000; display:block; position:relative}
  .pvtime:fullscreen .pvstage{
    position:absolute; inset:0; width:100%; height:100%; aspect-ratio:auto; max-width:none;
  }
  .pvtime:fullscreen .pvhead{
    position:absolute; top:0; left:0; right:0; z-index:3; border:0;
    background:linear-gradient(rgba(0,0,0,.72), transparent); padding:.7rem 1rem 2rem;
    opacity:0; transition:opacity .25s;
  }
  .pvtime:fullscreen .pvbar{position:absolute; top:0; left:0; right:0; z-index:4; background:transparent}
  .pvtime:fullscreen .pvbody{
    position:absolute; left:0; right:0; bottom:4.6rem; z-index:3; overflow:visible;
    background:linear-gradient(transparent, rgba(0,0,0,.82)); padding:2.5rem 1.2rem .8rem;
    opacity:0; transition:opacity .25s; pointer-events:none;
  }
  .pvtime:fullscreen .pvacts{
    position:absolute; left:0; right:0; bottom:0; z-index:4; border:0;
    background:rgba(0,0,0,.72); backdrop-filter:blur(8px);
    opacity:0; transition:opacity .25s;
  }
  /* マウスを動かすか、押したときだけ文字が出る。ふだんは映像だけ */
  .pvtime:fullscreen.awake .pvhead,
  .pvtime:fullscreen.awake .pvbody,
  .pvtime:fullscreen.awake .pvacts{opacity:1; pointer-events:auto}
  .pvtime:fullscreen .pvbody h2{font-size:1.35rem; text-shadow:0 2px 10px #000}
  .pvtime:fullscreen .pvline{font-size:.88rem; text-shadow:0 2px 8px #000}
  .pvtime:fullscreen .pvskip{display:none}

  .pvfull{
    font:inherit; font-size:.95rem; width:2.1rem; height:2.1rem; border-radius:50%;
    background:#22222a; color:var(--fg); border:0; cursor:pointer; display:grid; place-items:center;
  }
  .pvfull:hover{background:var(--accent)}

  /* ───────── 🔤 言葉で選ぶ（チェックするだけ）─────────
     ★利用者の指摘
       → ゼロから書かせない。並べて、押すだけにする。ポスターの好み聞き取りと同じ考え方。 */
  .words{position:fixed; inset:0; z-index:50; background:var(--bg); overflow-y:auto; padding-bottom:6rem}
  .words header{position:sticky; top:0; background:rgba(13,13,16,.96); backdrop-filter:blur(10px); padding:1rem; z-index:2}
  .words h2{font-size:1rem; font-weight:800}
  .words p{font-size:.76rem; color:var(--dim); line-height:1.7; margin-top:.3rem}
  .words h3{font-size:.82rem; font-weight:800; padding:1.1rem 1rem .5rem; color:#cfcfda}
  .words h3 small{font-weight:500; color:var(--dim); font-size:.7rem; margin-left:.4rem}

  .bundles{display:grid; grid-template-columns:1fr; gap:.55rem; padding:0 1rem}
  @media(min-width:620px){ .bundles{grid-template-columns:1fr 1fr} }
  @media(min-width:1000px){ .bundles{grid-template-columns:1fr 1fr 1fr} }
  .bnd{
    display:flex; gap:.7rem; align-items:center; cursor:pointer; text-align:left;
    background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:.6rem .7rem;
    font:inherit; color:var(--fg);
  }
  .bnd[data-v="好き"]{background:#1c1808; border-color:var(--gold)}
  .bnd[data-v="苦手"]{background:#1d1114; border-color:#a3324c; opacity:.85}
  .bnd[data-v="苦手"] .nm{text-decoration:line-through; text-decoration-color:#a3324c}
  .bnd .pic{width:44px; height:66px; flex:0 0 44px; border-radius:5px; overflow:hidden; background:#22222a}
  .bnd .pic img{width:100%; height:100%; object-fit:cover; display:block}
  .bnd .txt{flex:1; min-width:0}
  .bnd .nm{font-size:.86rem; font-weight:800; line-height:1.3}
  .bnd .ct{font-size:.68rem; color:var(--dim); margin-top:.2rem}
  .bnd .frm{font-size:.66rem; color:#8b8b98; margin-top:.25rem; line-height:1.45;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .bnd .tick2{width:1.5rem; flex:0 0 1.5rem; text-align:center; font-size:1.1rem; color:#3d3d48}
  .bnd[data-v="好き"] .tick2{color:var(--gold)}
  .bnd[data-v="苦手"] .tick2{color:#ff7f9c}

  .chips{display:flex; flex-wrap:wrap; gap:.4rem; padding:0 1rem}
  .chip{
    font:inherit; font-size:.76rem; cursor:pointer; padding:.4rem .75rem; border-radius:99px;
    background:var(--panel); border:1px solid var(--line); color:var(--dim);
  }
  .chip[data-v="好き"]{background:var(--gold); border-color:var(--gold); color:#221a00; font-weight:800}
  .chip[data-v="苦手"]{background:#2a0d15; border-color:#a3324c; color:#ff9fb5; font-weight:700; text-decoration:line-through}
  .chip small{opacity:.6; margin-left:.25rem}

  /* ───────── 🖼 絵だけで見る ─────────
     ★利用者の指摘
     → 文字を全部消して、絵だけを敷き詰める。
       何の作品かは、押すまで分からない。★それが「なにこれ？」の条件。 */
  .wall.bare{gap:.28rem; padding:.4rem; grid-template-columns:repeat(3,1fr)}
  @media(min-width:520px){ .wall.bare{grid-template-columns:repeat(5,1fr)} }
  @media(min-width:760px){ .wall.bare{grid-template-columns:repeat(7,1fr)} }
  @media(min-width:1020px){ .wall.bare{grid-template-columns:repeat(9,1fr)} }
  @media(min-width:1340px){ .wall.bare{grid-template-columns:repeat(11,1fr)} }
  .wall.bare .title, .wall.bare .sub,
  .wall.bare .kbn, .wall.bare .svc, .wall.bare .when, .wall.bare .mine{display:none}
  .wall.bare .shot{border-radius:4px; box-shadow:none}
  .wall.bare .play{width:1.4rem; height:1.4rem; font-size:.55rem; right:.15rem; bottom:.15rem; opacity:0}
  .wall.bare .card:hover .play{opacity:1}
  .wall.bare .card:hover .shot{transform:scale(1.06); z-index:2; box-shadow:0 4px 18px rgba(0,0,0,.8)}

  /* ───────── ポスターの壁 ───────── */
  .wall{
    display:grid; gap:.85rem .7rem; padding:1rem;
    grid-template-columns:repeat(2,1fr);
  }
  @media(min-width:520px){ .wall{grid-template-columns:repeat(3,1fr)} }
  @media(min-width:760px){ .wall{grid-template-columns:repeat(4,1fr)} }
  @media(min-width:1020px){ .wall{grid-template-columns:repeat(5,1fr)} }
  @media(min-width:1340px){ .wall{grid-template-columns:repeat(6,1fr)} }

  .card{cursor:pointer; display:flex; flex-direction:column; gap:.4rem}
  .shot{
    position:relative; aspect-ratio:2/3; border-radius:9px; overflow:hidden;
    background:#22222a; box-shadow:0 2px 10px rgba(0,0,0,.5);
    transition:transform .14s ease;
  }
  .card:hover .shot{transform:translateY(-3px)}
  .shot img{width:100%; height:100%; object-fit:cover; display:block}
  .shot .fallback{
    position:absolute; inset:0; display:grid; place-items:center; text-align:center;
    font-size:.7rem; color:var(--dim); padding:.5rem; background:#1c1c22;
  }
  /* ★ display:grid だけ書くと hidden 属性が効かず、エラー文が絵の上に乗り続ける */
  .shot .fallback[hidden]{display:none}

  .kbn{
    position:absolute; top:0; left:0; font-size:.62rem; font-weight:700;
    padding:.2rem .45rem; border-bottom-right-radius:7px; letter-spacing:.05em;
  }
  .kbn.新番組{background:var(--new); color:#fff}
  .kbn.放送中{background:var(--airing); color:#fff}
  .kbn.劇場{background:#ffcc00; color:#221a00}

  /* ───────── ♥棚を「状態」で分ける ─────────
     ★利用者の指摘
     実測：♥20作品のうち「🔴いま観られる」が8作品、「⚪待ち」が9作品。
     同じ顔で並んでいるから、今日できる8作品が9作品の待ちに紛れて埋もれる。
     通知は「待ち」にしか効かない（始まる日に鳴るので）。

  /* ───────── ♥棚の行動ボタン ─────────

  .acts2{display:flex; gap:.3rem; margin-top:.3rem; flex-wrap:wrap}
  .acts2 a, .acts2 button{
    font:inherit; font-size:.66rem; font-weight:700; cursor:pointer; text-decoration:none;

  }
  .acts2 a.go{background:var(--accent); border-color:var(--accent); color:#fff}

  .empty{padding:3rem 1rem; text-align:center; color:var(--dim); font-size:.85rem; line-height:1.9}

  /* ───────── △先頭へ ─────────
     248本あるので、下まで行くと戻るのが遠い。少し下げたら出る。 */
  .totop{
    position:fixed; right:1rem; bottom:calc(1.1rem + env(safe-area-inset-bottom));

  /* ───────── 個票（MOVIE WALKER のあの画面） ───────── */
  .veil{position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:40; backdrop-filter:blur(3px)}

  /* [みたい][みた][予告編] ─ MOVIE WALKER の3つ */

  .acts button{
    font:inherit; background:none; border:0; cursor:pointer; color:var(--dim);

  .bigbtn{
    display:block; margin:.9rem 1rem; padding:.85rem; border-radius:9px; border:0;

  .links a{font-size:.75rem; padding:.5rem .8rem; border-radius:7px; background:var(--panel);
    border:1px solid var(--line); text-decoration:none}

  /* 予告編 */
  .trailer{margin:0 1rem 1rem; aspect-ratio:16/9; border-radius:10px; overflow:hidden; background:#000}

  .dock{

</style>
</head>
<body>

<header>
  <div class="head-row">
    <h1>🎬 アニメカタログ</h1>
    <div class="meta" id="meta"></div>
  </div>
  <div class="shelves" id="shelves"></div>
  <div class="shelfnote" id="shelfnote"></div>
  <div class="filters">
    <div class="grp" id="f-sort">
      <button data-v="棚" aria-pressed="true">棚の順</button>
      <button data-v="日付">放送日順</button>
      <button data-v="人気">人気順</button>
      <button data-v="ばらばら">ばらばら</button>
    </div>
    <button class="toggle" id="f-watchable" aria-pressed="false">▶ 本当に観られるものだけ</button>
    <button class="toggle heart" id="f-mine" aria-pressed="false">♥ みたい・みた だけ</button>
    <button class="toggle" id="f-teach">🎲 好みを教える</button>
    <button class="toggle" id="f-words">🔤 言葉で選ぶ</button>
    <button class="toggle" id="f-bare" aria-pressed="false">🖼 絵だけで見る</button>
    <button class="toggle" id="f-shelfplay" style="background:#2a0d15;border-color:#a3324c;color:#ff9fb5;font-weight:800">▶ この棚を続けて観る</button>
    <button class="toggle" id="f-export" title="この端末で押した♥などを写す。別の端末の「📥 記録を読み込む」に貼る">📤 記録を写す</button>
    <button class="toggle" id="f-import" title="別の端末で写した記録を、この端末に足す">📥 記録を読み込む</button>
    <button class="toggle" id="f-pvtime" style="background:#1a1520;border-color:#4a4550;color:#c9b9d9;font-weight:700">🎞 予告編タイム</button>
  </div>
</header>

<div class="loading" id="loading">素材を読み込んでいます…</div>
<main class="wall" id="wall" hidden></main>
<footer class="end" id="end" hidden></footer>
<div class="empty" id="empty" hidden></div>
<button class="totop" id="totop" aria-label="先頭へ戻る"><span class="ar">▲</span><span>先頭へ</span></button>
<div id="modal"></div>
<div id="teach"></div>
<div id="words"></div>
<div id="pvtime"></div>

<script type="module">
import { buildTaste, rankWorks, 続編を探す, tasteは空, 知られ具合, 世間の数を測る, 前例のない } from './score.mjs';

const state = {
  works: [], byId: new Map(),
  watchlist: new Map(),   // id → { id, タイトル, ポスター, 押した日 }
  kaikin:    new Map(),   // id → { id, タイトル, 公開日, 観る日, 見張り中 } ★解禁ウォッチャーに入れた劇場アニメ（隣のアプリのファイル）
  reviews:   new Map(),   // id → { id, タイトル, みた日, ★, 感想, レビュー }
  picks:     new Map(),   // id → 好み聞き取りでタップした作品（seeds の中身をそのまま）
  pvSeen:    new Map(),   // id → 予告編タイムで見送った作品 ★「また同じ予告編からか」を防ぐ
  notForMe:  new Map(),   // id → 「🚫 興味ない」を押した作品 ★観なくても『違う』と言える唯一の手段
  人気の扱い: 'マイナーを上に',
  lineage: null,           // シリーズの系譜（前作の前作…まで遡ったもの）
  帯: {},
  束: [],                  // data/keywords.json（利用者の言葉 → AniListのタグ）
  選んだ束: new Set(),      // 「好き」と押した束
  嫌いな束: new Set(),      // 「苦手」と押した束 ★利用者の指摘
  選んだタグ: new Set(),     // 「好き」と押した言葉（'タグ:Philosophy' の形）
  嫌いなタグ: new Set(),     // 「苦手」と押した言葉
  seeds: [], taste: null, lexicon: {},
  棚:'ぜんぶ', sort:'棚', watchable:false, mine:false, bare:false, たね:1,
  契約: [],
};

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toLocaleDateString('sv-SE');   // YYYY-MM-DD

/* ───────── 保存（画面 → data/ のファイル） ─────────
   ★localStorage ではなくファイルに書く。チャットは流れるが、ファイルは残る。 */
const savers = {};
function save(key){
  clearTimeout(savers[key]);
  savers[key] = setTimeout(async () => {
    const v = state[key];
    // Map は中身の配列に、ふつうの物はそのまま
    const body = JSON.stringify(v instanceof Map ? [...v.values()] : v, null, 1);
    try {
      localStorage.setItem('anime:' + key, body);
      flash('この端末に保存しました');
    } catch (e) {
      flash('⚠️ 保存できませんでした：' + e.message, true);
    }
  }, 350);
}
function flash(msg, bad){
  const el = document.getElementById('saved');
  if (!el) return;
  el.textContent = msg;
  el.style.color = bad ? '#ff8080' : '#7fe0a8';
  if (!bad) setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 1800);
}

/* ───────── 一覧 ───────── */
function matchKbn(w, kbn){
  // ★「最近公開」＝劇場アニメ等で、公開されて10か月以内のもの。
  //   AniListは上映終了を持っていないので「上映中」とは言い切らない
  if (kbn === 'ぜんぶ') return w.区分 === '新番組' || w.区分 === '放送中' || w.区分 === '最近公開';
  if (kbn === '劇場')   return w.形式 === 'MOVIE';
  return w.区分 === kbn;
}

/**
 * 放送日順の中身。★ここは一度まちがえた場所。
 *   新番組 → これから始まる順（昇順）。近いものから知りたい
 *   放送中 → 最近始まった順（降順）。昇順にするとサザエさん(1969)が最上段に来てしまう
 */
function byDate(a, b){
  const 新A = a.区分 === '新番組', 新B = b.区分 === '新番組';
  if (新A !== 新B) return 新A ? -1 : 1;
  const ad = a.放送開始?.length === 10 ? a.放送開始 : null;
  const bd = b.放送開始?.length === 10 ? b.放送開始 : null;
  if (ad && bd){
    if (ad === bd) return (b.人気|0) - (a.人気|0);
    return 新A ? (ad < bd ? -1 : 1) : (ad > bd ? -1 : 1);
  }
  if (ad) return -1;
  if (bd) return 1;
  return (b.人気|0) - (a.人気|0);
}

function visible(){
  let list = 棚の中身(state.棚);
  if (state.watchable) list = list.filter(r => r.w.配信.契約中.length > 0);
  if (state.mine) list = list.filter(r => state.watchlist.has(r.w.id) || state.reviews.has(r.w.id));

  if (state.sort === 'ばらばら') {
    // ★セレンディピティ。本屋の隣の棚が予想できないのと同じで、順番を予想させない。
    //   押すたび たね が変わるので、混ざり直す
    const 混ぜる = (id) => { let x = (id * 2654435761 + state.たね * 40503) >>> 0;
      x ^= x >>> 15; x = (x * 2246822507) >>> 0; return x; };
    list.sort((a, b) => 混ぜる(a.w.id) - 混ぜる(b.w.id));
  } else if (state.sort === '人気') {
    list.sort((a, b) => (b.w.人気|0) - (a.w.人気|0));
  } else if (state.sort === '日付') {
    list.sort((a, b) => byDate(a.w, b.w));
  } else if (!list.some(r => r.点 != null)) {
    // 「棚の順」で、点が無い棚なら放送日順
    list.sort((a, b) => byDate(a.w, b.w));
  }
  return list;
}

function card({ w, 点, 理由 }){
  const kbnLabel = w.形式 === 'MOVIE' ? '劇場' : w.区分;

  // ★段ごとに見た目を変える。契約中だけが「観られる」。参考は観られる保証がない
  const pills = [];
  if (w.配信.劇場) pills.push(`<span class="pill gek">劇場</span>`);
  else {
    for (const s of w.配信.契約中.slice(0,2))
      pills.push(`<span class="pill" style="background:${esc(s.色)}">${esc(s.略)}</span>`);
    if (!w.配信.契約中.length){
      for (const s of w.配信.未加入.slice(0,2)) pills.push(`<span class="pill dim">${esc(s.略)}</span>`);
      if (!w.配信.未加入.length)
        for (const s of w.配信.参考.slice(0,1)) pills.push(`<span class="pill ref">${esc(s.略)}</span>`);
    }
  }

  const 配信文 =
      w.配信.劇場        ? `<span class="gek-note">${esc(w.配信.劇場の言葉)}</span>`
    : w.配信.契約中.length ? w.配信.契約中.map(s=>s.表示).join('・')
    : w.配信.未加入.length ? w.配信.未加入.map(s=>s.表示).join('・')
    : w.配信.参考.length   ? `<span class="ref-note">${esc(w.配信.参考[0].表示)}</span>`
    : `<span class="unknown-note">${esc(w.配信.分からないときの言葉)}</span>`;

  const img = w.ポスター
    ? `<img src="${esc(w.ポスター)}" alt="" loading="lazy" decoding="async"
            onerror="this.style.display='none';this.nextElementSibling.hidden=false">
       <div class="fallback" hidden>絵が読み込めませんでした</div>`
    : `<div class="fallback">絵がありません</div>`;

  const r = state.reviews.get(w.id);
  const 印 = [];
  if (state.watchlist.has(w.id)) 印.push('<span class="h">♥</span>');
  if (state.kaikin.has(w.id))    印.push('<span class="b">🔔</span>');
  if (r?.['★']) 印.push(`<span class="s">★${r['★']}</span>`);
  else if (r) 印.push('<span class="s">👁</span>');

  return `<article class="card" data-id="${w.id}">
    <div class="shot" style="background:${esc(w.色)}22">
      ${img}
      <span class="kbn ${esc(kbnLabel)}">${esc(kbnLabel)}</span>
      <div class="svc">${pills.join('')}</div>
      <div class="when${w.放送開始?.length === 10 ? '' : ' tbd'}">${esc(w.放送開始表示)}${w.形式==='MOVIE'?' 公開':''}</div>
      ${印.length ? `<div class="mine">${印.join('')}</div>` : ''}
      ${点 != null ? `<span class="score">${点}</span>` : ''}
      ${w.予告編 ? `<button class="play" data-trailer="${w.id}" title="予告編を見る">▶</button>` : ''}
    </div>
    <div class="title">${esc(w.タイトル)}</div>
    <div class="sub">${配信文}</div>
    ${理由 ? `<div class="why">${esc(理由)}</div>` : ''}
    ${state.棚 === '選:押した' ? 行動ボタン(w) : ''}
  </article>`;
}

/* ───────── おすすめ ─────────
   ★機械は「利用者はこれを好き」と決めない。並べ替えと、理由を言うことだけをする。
     理由の言えないものは出さない（score.mjs 側で落としている）。 */
/** チェックした束と個別の言葉を、計算に渡せる形（[{種,名前}]）にほどく */
function 選んだ言葉を集める(){
  const out = [];
  const 束を足す = (名, 向き) => {
    const b = state.束.find((x) => x.名前 === 名); if (!b) return;
    for (const t of b.タグ ?? []) out.push({ 種: 'タグ', 名前: t, 向き });
    for (const g of b.ジャンル ?? []) out.push({ 種: 'ジャンル', 名前: g, 向き });
  };
  for (const 名 of state.選んだ束) 束を足す(名, 1);
  for (const 名 of state.嫌いな束) 束を足す(名, -1);   // ★苦手もはっきり伝える
  for (const k of state.選んだタグ) { const [種, ...r] = k.split(':'); out.push({ 種, 名前: r.join(':'), 向き: 1 }); }
  for (const k of state.嫌いなタグ)  { const [種, ...r] = k.split(':'); out.push({ 種, 名前: r.join(':'), 向き: -1 }); }
  return out;
}

}

/* ───────── 好みを教える（ポスターをタップ）─────────
   利用者の案をそのまま採用。★説明しない。絵を並べるだけ。
   ★数える単位は「作品」。「枚」はポスターを並べる側の目線だった（利用者の指摘・2026-08-31） */
const ひと山 = 30;
let 出している = [];

/** まだ出していないものから、ランダムに引く。★引いたぶんだけを返す（足すために使う） */
function 引く(n = ひと山){
  const 済 = new Set(出している.map((s) => s.id));
  const 残り = state.seeds.filter((s) => !済.has(s.id));
  for (let i = 残り.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [残り[i], 残り[j]] = [残り[j], 残り[i]];
  }
  const 新規 = 残り.slice(0, n);
  出している = [...出している, ...新規];
  return 新規;
}

function tcardHTML(s){
  return `<div class="tcard" data-sid="${s.id}" aria-pressed="${state.picks.has(s.id)}">
    <img src="${esc(s.ポスター)}" alt="" loading="lazy" decoding="async">
    <span class="tick">✓</span>
    <div class="yr">${s.年}</div>
  </div>`;
}

function ボタンを直す(){

  const more = document.getElementById('t-more');
  if (more){

    more.disabled = 残り <= 0;

/**
 * ♥棚のカードに出す行動ボタン。★「観る」と書けるのは、本当に観られるときだけ。
 *   劇場アニメは配信ではなく劇場なので、公式サイトへ送る。
 */
/**
 * ♥に入れた作品が、いまどの状態か。★これが「埋もれ」を壊す軸。
 *   通知は「まだ始まっていないもの」にしか効かない。
 *   もう始まっているものは永遠に鳴らないので、画面のいちばん上に出す。
 */
function 押したものの状態(w){
  if (state.reviews.has(w.id)) return '観た';
  const d = w.放送開始 ?? '';
  const 今日 = today();
  if (d.length !== 10) return '未定';
  if (d <= 今日) return w.配信.契約中.length ? 'いま観られる' : (w.配信.劇場 ? '公開ずみ' : '始まっている');
  const あと = Math.round((new Date(d + 'T12:00:00+09:00') - new Date(今日 + 'T12:00:00+09:00')) / 86400000);
  return あと <= 7 ? 'もうすぐ' : '待ち';
}

  { key:'始まっている', 名:'🔵 もう始まっています', 印:'now', note:'配信はまだ分かっていません' },
  { key:'公開ずみ',     名:'🎬 もう公開されています', 印:'now', note:'劇場で確かめてください' },
  { key:'待ち',         名:'⚪ 待っているもの', 印:'wait',  note:'まだ先です' },
  { key:'未定',         名:'❓ 予定が未定',     印:'wait',  note:'日付が決まったらLINEで知らせます' },
  { key:'観た',         名:'👁 観たもの',       印:'seen2', note:'★と感想を残せます' },
];

function 行動ボタン(w){
  const 観た = state.reviews.has(w.id);
  const 出 = [];

  if (w.配信.劇場) {
    if (w.公式サイト) 出.push(`<a class="gek" href="${esc(w.公式サイト)}" target="_blank" rel="noopener" data-stop>🎬 劇場の公式サイト</a>`);
    出.push(`<span class="when2">${esc(w.放送開始表示)} 公開</span>`);
  } else if (w.配信.契約中.length) {
    for (const sv of w.配信.契約中.slice(0, 2))
      出.push(`<a class="go" href="${esc(sv.url)}" target="_blank" rel="noopener" data-stop>▶ ${esc(sv.名前)}</a>`);
  } else if (w.配信.未加入.length) {
    出.push(`<a href="${esc(w.配信.未加入[0].url)}" target="_blank" rel="noopener" data-stop>${esc(w.配信.未加入[0].表示)}</a>`);
  } else if (w.公式サイト) {
    出.push(`<a class="ref" href="${esc(w.公式サイト)}" target="_blank" rel="noopener" data-stop>🌐 公式サイト</a>`);
  }

  // まだ始まっていないものは「いつから」を出す（観るボタンより先に知りたい）
  if (w.区分 === '新番組' && !w.配信.劇場)
    出.unshift(`<span class="when2">${esc(w.放送開始表示)} から</span>`);

  出.push(`<button class="seen" data-seen="${w.id}" aria-pressed="${観た}" data-stop>${観た ? '👁 みた' : '👁 みたら押す'}</button>`);
  return `<div class="acts2">${出.join('')}</div>`;
}

function render(){
  renderShelves();            // ★帯はやめた。棚を1つ選ぶと、その中身が壁いっぱいに出る
  予告編タイムのボタンを直す();
  const list = visible();
  const wall = document.getElementById('wall');
  const empty = document.getElementById('empty');
  const end = document.getElementById('end');

  const 押した = state.watchlist.size, 観た = state.reviews.size;
  document.getElementById('meta').innerHTML =
    `${list.length}作品 / 全${state.works.length}作品`
    + (押した || 観た ? `<br>♥${押した} 👁${観た}` : '')
    + `<br>更新 ${esc(state.更新)}`;

  if (!list.length){
    wall.hidden = true; end.hidden = true; empty.hidden = false;
    empty.innerHTML = state.mine
      ? 'まだ「みたい」も「みた」も押していません。<br>ポスターを押すと、詳しい画面が開きます。'
      : `この棚には、いま出せる作品がありませんでした。<br>ほかの棚を選んでみてください。`;
    return;
  }
  empty.hidden = true; wall.hidden = false;
  wall.classList.toggle('bare', state.bare);

  if (state.棚 === '選:押した' && !state.bare) {
    // ★状態ごとに区切る。今日できることが、待ちに紛れないように
    const 箱 = {};
    for (const r of list) (箱[押したものの状態(r.w)] ??= []).push(r);
    wall.innerHTML = 状態のならび.flatMap((g) => {
      const v = 箱[g.key]; if (!v?.length) return [];
      return [`<div class="grouphead ${g.印}">${g.名}<small>${v.length}作品　${g.note}</small></div>`,
              ...v.map(card)];
    }).join('');
  } else {
    wall.innerHTML = list.map(card).join('');
  }
  end.hidden = false;
  end.innerHTML = endBlock(list.length);
}

/**
 * 個票を「作り直さずに」書き換える。
 * ★ここは一度まちがえた場所：みたいを押すたびに openDetail() で全部作り直していたため、
 *   予告編を見ている最中に押すと iframe ごと消えて動画が止まっていた。
 *   押したところだけを書き換えれば、動画は流れたまま。
 */
function refreshDetail(w){
  const wl = state.watchlist.has(w.id);
  const rv = state.reviews.get(w.id);
  const 星 = rv?.['★'] ?? 0;

  document.getElementById('b-mitai').setAttribute('aria-pressed', String(wl));
  document.getElementById('b-mita').setAttribute('aria-pressed', String(!!rv));
  document.getElementById('badge-slot').innerHTML = badgesHtml(w);
  const bK = document.getElementById('b-kaikin');
  if (bK){
    const on = state.kaikin.has(w.id);
    bK.setAttribute('aria-pressed', String(on));
    bK.innerHTML = `<span class="ico">🔔</span>${on ? '見張り登録ずみ' : '解禁を見張る'}`;
  }

  const hs = document.getElementById('hero-stats');
  hs.querySelector('.mystar')?.remove();
  if (星){
    const s = document.createElement('span');
    s.className = 'mystar';
    s.textContent = `${'★'.repeat(星)}${'☆'.repeat(5-星)} ${星}.0`;
    hs.appendChild(s);
  }

  const rev = document.getElementById('review');
  rev.hidden = !rv;
  for (const b of rev.querySelectorAll('#stars button')){
    const n = Number(b.dataset.n);
    b.classList.toggle('on', n <= 星);
    b.textContent = n <= 星 ? '★' : '☆';
  }

  // 入力欄は、打鍵中のものに書き戻さない（カーソルが飛ぶため）
  const k = document.getElementById('r-kanso');
  const t = document.getElementById('r-review');
  if (!rv){ k.value = ''; t.value = ''; }
  else {
    if (document.activeElement !== k) k.value = rv['感想'] ?? '';
    if (document.activeElement !== t) t.value = rv['レビュー'] ?? '';
  }
}

function closeDetail(){
  document.getElementById('modal').innerHTML = '';
  document.body.classList.remove('locked');
  recomputeTaste();   // 押した／★を付けたぶん、好みが動く
  render();           // 壁に押した印を、上の帯におすすめを反映する
}

function wireDetail(w){
  const modal = document.getElementById('modal');
  modal.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', closeDetail));

  // ♥ みたい
  const bM = document.getElementById('b-mitai');
  bM.addEventListener('click', () => {
    if (state.watchlist.has(w.id)) state.watchlist.delete(w.id);
    else state.watchlist.set(w.id, {
      id:w.id, タイトル:w.タイトル, ポスター:w.ポスター,
      放送開始:w.放送開始, 区分:w.区分, 押した日: today(),
    });
    save('watchlist');
    refreshDetail(w);   // ★作り直さない。予告編を見ている最中でも動画が止まらない
  });

  // 🔔 解禁を見張る → 隣の解禁ウォッチャーの watchlist.json に1本ぶん書く（サーバーが書く）
  const bK = document.getElementById('b-kaikin');
  bK?.addEventListener('click', async () => {
    const on = !state.kaikin.has(w.id);
    bK.disabled = true;
    try {
      const r = await fetch('/api/kaikin', { method:'POST', body: JSON.stringify({ id: w.id, on }) });
      const j = await r.json();
      if (!r.ok) throw new Error(j.エラー ?? r.statusText);
      state.kaikin.clear();
      for (const x of j.kaikin ?? []) if (x.id != null) state.kaikin.set(x.id, x);
      flash(on ? '🔔 解禁ウォッチャーに入れました' : '解禁ウォッチャーから外しました');
    } catch (e) {
      flash('⚠️ 解禁ウォッチャーに書けませんでした：' + e.message, true);
    }
    bK.disabled = false;
    refreshDetail(w);
  });

  // 👁 みた → 押すと記録欄が開く
  const bW = document.getElementById('b-mita');
  bW.addEventListener('click', () => {
    if (state.reviews.has(w.id)) {
      state.reviews.delete(w.id);
    } else {
      state.reviews.set(w.id, {
        id:w.id, タイトル:w.タイトル, みた日: today(), '★':0, 感想:'', レビュー:'',
      });
    }
    save('reviews');
    refreshDetail(w);
  });

  // 🚫 興味ない ─ 観なくても「違う」と言える。★機械は勝手に判定しない。利用者が押す
  document.getElementById('b-nope')?.addEventListener('click', () => {
    if (state.notForMe.has(w.id)) state.notForMe.delete(w.id);
    else state.notForMe.set(w.id, { id:w.id, タイトル:w.タイトル, 押した日: today() });
    save('notForMe');
    const b = document.getElementById('b-nope');
    const on = state.notForMe.has(w.id);
    b.setAttribute('aria-pressed', String(on));
    b.textContent = on ? '🚫 興味ないと伝えました（もう一度押すと取り消し）'
                       : '🚫 これは興味ない（おすすめに出さなくなります）';
  });

  // ▶ 予告編（押されたときだけ読み込む。248本ぶんを先に読ませない）
  const bP = document.getElementById('b-pv');
  if (w.予告編) bP.addEventListener('click', () => {
    const slot = document.getElementById('pv-slot');
    if (slot.innerHTML) { slot.innerHTML = ''; bP.setAttribute('aria-pressed','false'); return; }
    slot.innerHTML = `<div class="trailer"><iframe
      src="https://www.youtube.com/embed/${esc(w.予告編)}?rel=0&autoplay=1"
      allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>`;
    bP.setAttribute('aria-pressed','true');
    // ★動画ではなくボタン列を上端に寄せる。動画はその真下なので、
    //   「観ながら みたい を押す」ができる（動画を中央に寄せるとボタンが画面外へ出る）
    document.querySelector('.acts').scrollIntoView({ behavior:'smooth', block:'start' });
  });

  // ★ 点数
  const rv = () => state.reviews.get(w.id);
  document.getElementById('stars')?.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const n = Number(b.dataset.n);
    const r = rv(); if (!r) return;
    r['★'] = (r['★'] === n) ? 0 : n;      // 同じ星をもう一度押すと取り消し
    save('reviews');
    refreshDetail(w);
  });

  // 感想・レビュー
  const bind = (elId, key) => {
    const el = document.getElementById(elId); if (!el) return;
    el.addEventListener('input', () => { const r = rv(); if (!r) return; r[key] = el.value; save('reviews'); });
  };
  bind('r-kanso','感想');
  bind('r-review','レビュー');
}

/* ───────── 📚 棚 ─────────
   ★利用者の指摘
     「3行にわたるカテゴリー分けされたポスターと、その下に大きめのポスターがタイル状に
       敷き詰められていて、なにが主役かわからなくなってきました」

   芯は『ポスターの壁が主役。好みは順番に使い、絞り込みには使わない』。
   → 帯（横スクロールの3列）をやめる。棚を1つ選ぶと、その中身が壁いっぱいに出る。
     入口は1つ。主役はいつも壁。 */

function 棚の一覧(){
  const 内容 = state.束.map((b) => ({ key: '束:' + b.名前, 名: b.名前, 組: '内容' }));
  return [
    // ★2026-09-01 利用者の指摘
    { key: '選:押した', 名: '♥ 押したもの', 組: '' },
    { key: 'ぜんぶ', 名: 'ぜんぶ', 組: '' },
    { key: '時期:新番組', 名: '🆕 新番組', 組: 'いつの' },
    { key: '時期:放送中', 名: '📺 放送中', 組: 'いつの' },
    { key: '時期:最近公開', 名: '🎬 最近公開', 組: 'いつの' },
    { key: '時期:劇場', 名: '🍿 劇場アニメ', 組: 'いつの' },
    { key: '選:これから公開の映画', 名: '🍿 これから公開の映画', 組: 'えらぶ' },
    { key: '選:好みに近い', 名: '⭐ 好みに近い', 組: 'えらぶ' },
    { key: '選:前衛的', 名: '🆕 前衛的', 組: 'えらぶ' },
    { key: '選:あの続編', 名: '🔥 あの続編', 組: 'えらぶ' },
    ...内容,
  ];
}

/** その棚の中身。[{w, 点, 理由}] を返す。点があれば「棚の順」で並ぶ */
function 棚の中身(key){
  const いま = state.works.filter((w) => ['新番組', '放送中', '最近公開'].includes(w.区分));
  // ★2026-09-01 利用者の指摘
  //   → 押したものは消さない。消すのは「🚫 興味ない」だけ。押した印（♥）で見分ける
  const 出さない = new Set(state.notForMe.keys());
  const 素 = (list) => list.map((w) => ({ w, 点: null, 理由: null }));
  const 好み順 = (list) => rankWorks(list, state.taste,
      { lexicon: state.lexicon, 除外: 出さない, 人気の扱い: state.人気の扱い })
    .map((r) => ({ w: r.w, 点: r.点, 理由: [知られ具合(r.人気の位置), r.理由].filter(Boolean).join('　') }));

  if (key === 'ぜんぶ') return 素(いま);

  if (key.startsWith('時期:')) {
    const v = key.slice(3);
    if (v === '劇場') return 素(いま.filter((w) => w.形式 === 'MOVIE'));
    return 素(いま.filter((w) => w.区分 === v));
  }

  if (key === '選:押した') {
    // ★ここが拠点。押した順（新しいものが上）。放送日が近いものを先に見たいので日付順も選べる
    const 押 = state.works.filter((w) => state.watchlist.has(w.id) || state.reviews.has(w.id));
    const 日 = (w) => state.watchlist.get(w.id)?.押した日 ?? state.reviews.get(w.id)?.みた日 ?? '';
    return 押.sort((a, b) => (日(b) < 日(a) ? -1 : 1)).map((w) => ({ w, 点: null, 理由: null }));
  }

  if (key === '選:あの続編')
    // ★好みに選んだ作品も種にする（161作品）。シリーズを遡って先祖まで見る
    return 続編を探す(state.works,
        [...state.watchlist.keys(), ...state.reviews.keys(), ...state.picks.keys()], state.lineage)
      .filter((r) => !state.notForMe.has(r.w.id) && !state.watchlist.has(r.w.id))
      .map((r) => ({ w: r.w, 点: null, 理由: r.理由 }));

  if (key === '選:前衛的') {
    if (!state.seeds.length) return [];
    state.世間 ??= 世間の数を測る(state.seeds);
    return 前例のない(いま, state.世間,
      { lexicon: state.lexicon, 除外: 出さない, 人気の扱い: state.人気の扱い });
  }

  if (key === '選:これから公開の映画')
    return 好み順(state.works.filter((w) => w.形式 === 'MOVIE' && w.区分 === '新番組')).slice(0, 60);

  // ★棚は「選ばれたもの」。全部を並べ替えただけでは棚にならない（341/365になっていた）
  if (key === '選:好みに近い') return 好み順(いま).slice(0, 60);

  if (key.startsWith('束:')) {
    const b = state.束.find((x) => x.名前 === key.slice(2));
    if (!b) return [];
    const ts = new Set(b.タグ ?? []), gs = new Set(b.ジャンル ?? []);
    const 当たる = いま.filter((w) =>
      (w.タグ ?? []).some((x) => x.重み >= 60 && ts.has(x.名前)) || (w.ジャンル ?? []).some((g) => gs.has(g)));
    // 束の棚は、好みが分かっていれば好みの順。分からなければそのまま
    return tasteは空(state.taste) ? 素(当たる) : 好み順(当たる).slice(0, 80);
  }
  return 素(いま);
}

/* ───────── 🎞 予告編タイム ─────────
   利用者の指定（2026-08-31）：
     「実際の映画館のように1ヶ月〜半年後に公開決定されたトレーラーが上映されている。
       サイトでも、これから上映・放送されるトレーラーを次々に開いてもらえると最高。
       さらに、自分の好みに近い作品から開くことができたら、さらに最高」
   ★おすすめは「探す」ではなく「流す順番」だけを決める。出会いそのものは奪わない。 */
const pv = { list: [], i: 0, player: null, 並び: '', 全体: 0, 見送りずみ: 0, 源: null };

/** YouTube の再生終了を受け取るために、公式のプレーヤーAPIを読み込む。 */
function YouTubeAPIを用意する(){
  if (window.YT?.Player) return Promise.resolve();
  if (window.__ytLoading) return window.__ytLoading;
  window.__ytLoading = new Promise((res) => {
    window.onYouTubeIframeAPIReady = res;
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  });
  return window.__ytLoading;
}

/**
 * 流す順番を決める。★これから公開・放送されるもので、予告編があるものだけ。
 * ★見送ったものは出さない（利用者の指摘2026-08-31）
 */
function 順番をつくる(){
  // ★帯から呼ばれたときは、その帯の並びをそのまま使う（利用者の指定・2026-08-31）
  //   「これから公開される映画からトレーラーを再生したら、
  //     これから公開される映画のトレーラーを連続で再生することは可能ですか？」
  if (pv.源) {
    const 一覧 = pv.源.作品.filter((w) => w.予告編);
    pv.全体 = 一覧.length; pv.見送りずみ = 0; pv.並び = pv.源.名前;
    pv.list = 一覧.map((w) => ({ w, 点: null, 理由: null, 人気の位置: null }));
    // 帯の理由をそのまま持ち込む（せっかく出しているので）
    for (const r of pv.list) {
      const 元 = pv.源.情報?.get(r.w.id);
      if (元) { r.点 = 元.点; r.理由 = 元.理由; r.人気の位置 = 元.人気の位置; }
    }
    return;
  }
  const 全部 = state.works.filter((w) => w.区分 === '新番組' && w.予告編);
  const 候補 = 全部.filter((w) => !state.pvSeen.has(w.id) && !state.notForMe.has(w.id));
  pv.全体 = 全部.length;
  pv.見送りずみ = 全部.length - 候補.length;

  // 好みが分かっていれば、好みに近い順。分からなければ公開・放送の近い順
  const 点つき = rankWorks(候補, state.taste, { lexicon: state.lexicon, 除外: new Set(), 人気の扱い: state.人気の扱い });
  const 済 = new Set(点つき.map((r) => r.w.id));
  const 残り = 候補
    .filter((w) => !済.has(w.id))
    .sort((a, b) => ((a.放送開始 ?? '9999') < (b.放送開始 ?? '9999') ? -1 : 1));

  pv.list = [...点つき.map((r) => ({ w: r.w, 点: r.点, 理由: r.理由, 人気の位置: r.人気の位置 })),
             ...残り.map((w) => ({ w, 点: null, 理由: null, 人気の位置: null }))];
  pv.並び = 点つき.length ? '好みに近い順' : '公開・放送が近い順';
}

/** 見送った（最後まで観た／飛ばした）ことを覚える。次はここから先が流れる。 */
function 見送った(w, 最後まで){
  state.pvSeen.set(w.id, {
    id: w.id, タイトル: w.タイトル, 日: today(),
    最後まで観た: !!最後まで,
  });
  save('pvSeen');
}

function pvを塗り直す(){

function pvを流す(n){
  if (n >= pv.list.length){ pv一周した(); return; }
  pv.i = n;
  const { w } = pv.list[n];
  pvを塗り直す();
  if (pv.player?.loadVideoById) pv.player.loadVideoById(w.予告編);
}

/** @param 最後まで true=最後まで観た／false=飛ばした。どちらも「見送った」として覚える */
function pvの次へ(最後まで = false){
  見送った(pv.list[pv.i].w, 最後まで);
  pvを流す(pv.i + 1);
}

/** 全部見送った。★「ぜんぶ観ました」を出して、はじめから観る道も置く */
function pv一周した(){

async function pvを開く(源 = null){
  pv.源 = 源;
  順番をつくる();
  if (!pv.list.length){
    alert('予告編がある作品が見つかりませんでした');
    return;
  }
  pv.i = 0;

  document.getElementById('pvtime').innerHTML = `
    <div class="pvtime">
      <div class="pvhead">

  document.body.classList.add('locked');
  pvを塗り直す();

  const 箱 = document.querySelector('.pvtime');

  // ── 映画館モード（フルスクリーン）
  //    ★利用者の指定：「映画館のようにフルスクリーンにしてほしい」
  //    ブラウザは「人が押したとき」しか全画面にできないので、開いた流れでそのまま入る
  const 全画面へ = async () => {
    try { if (!document.fullscreenElement) await 箱.requestFullscreen(); } catch {}
  };
  const 全画面を出る = async () => {
    try { if (document.fullscreenElement) await document.exitFullscreen(); } catch {}
  };
  document.getElementById('pv-full').addEventListener('click', () => {
    document.fullscreenElement ? 全画面を出る() : 全画面へ();
  });

  // 全画面のあいだは、動かしたときだけ文字を出す。ふだんは映像だけ（映画館と同じ）
  let 眠らせる;
  const 起こす = () => {
    箱.classList.add('awake');
    clearTimeout(眠らせる);
    眠らせる = setTimeout(() => 箱.classList.remove('awake'), 2600);
  };
  箱.addEventListener('mousemove', 起こす);
  箱.addEventListener('touchstart', 起こす, { passive: true });
  箱.addEventListener('click', 起こす);
  起こす();

  document.getElementById('pv-close').addEventListener('click', async () => {
    await 全画面を出る();
    pvを閉じる(false);
  });
  document.getElementById('pv-next').addEventListener('click', () => pvの次へ(false));
  // 観ながら「違う」と思ったら、その場で伝えて次へ。★動画は止めない
  document.getElementById('pv-nope').addEventListener('click', () => {
    const { w } = pv.list[pv.i];
    state.notForMe.set(w.id, { id:w.id, タイトル:w.タイトル, 押した日: today() });
    save('notForMe');
    pvの次へ(false);
  });
  document.getElementById('pv-like').addEventListener('click', () => {
    // ★押しても動画は止めない（予告編が消えた件と同じ轍を踏まない）
    const { w } = pv.list[pv.i];
    if (state.watchlist.has(w.id)) state.watchlist.delete(w.id);
    else state.watchlist.set(w.id, {
      id:w.id, タイトル:w.タイトル, ポスター:w.ポスター,
      放送開始:w.放送開始, 区分:w.区分, 押した日: today(),
    });
    save('watchlist');
    pvを塗り直す();
  });

  // ★ここで全画面に入る。await より前でないと「人が押した」扱いが切れて拒否される
  全画面へ();

  await YouTubeAPIを用意する();
  pv.player = new YT.Player('pv-player', {
    videoId: pv.list[0].w.予告編,
    playerVars: { rel: 0, autoplay: 1, playsinline: 1 },
    events: {
      onReady: (e) => e.target.playVideo(),
      // 1本終わったら、黙っていても次が流れる（映画館と同じ）
      onStateChange: (e) => { if (e.data === YT.PlayerState.ENDED) pvの次へ(true); },   // 最後まで観た
      // 消された動画・埋め込み禁止の動画は、止まらずに飛ばす
      onError: () => pvの次へ(false),   // 観られない動画は、飛ばしたことにして次へ
    },
  });
}

function pvを閉じる(最後まで見た){

/* ───────── 🔤 言葉で選ぶ（チェックするだけ）─────────
   ★利用者の指摘「リストアップしてもらってチェックできる機能は作れますか？」
     → ゼロから書かせない。こちらが並べて、押すだけにする。
     ポスターの好み聞き取りが効いたのと同じ理由（並んでいるものからは選べる）。 */
function 束の該当(b){
  const ts = new Set(b.タグ ?? []), gs = new Set(b.ジャンル ?? []);
  return state.works.filter((w) =>
    ['新番組','放送中','最近公開'].includes(w.区分) &&
    ((w.タグ ?? []).some((x) => x.重み >= 60 && ts.has(x.名前)) || (w.ジャンル ?? []).some((g) => gs.has(g))));
}

/** カタログに実際にある言葉を、多い順に。日本語にできるものだけ出す */
function 選べる言葉(){
  const 除外 = new Set(state.lexicon['理由に使わないタグ'] ?? []);
  const c = new Map();
  for (const w of state.works.filter((x) => ['新番組','放送中','最近公開'].includes(x.区分))) {
    for (const x of w.タグ ?? []) if (x.重み >= 60 && !除外.has(x.名前)) c.set('タグ:'+x.名前, (c.get('タグ:'+x.名前) ?? 0) + 1);
    for (const g of w.ジャンル ?? []) c.set('ジャンル:'+g, (c.get('ジャンル:'+g) ?? 0) + 1);
  }
  return [...c.entries()]
    .map(([k, v]) => { const [種, ...r] = k.split(':'); const 名前 = r.join(':');
      const ja = 種 === 'タグ' ? state.lexicon['タグ']?.[名前] : state.lexicon['ジャンル']?.[名前];
      return { k, 種, 名前, ja, 数: v }; })
    .filter((x) => x.ja && x.数 >= 3)
    .sort((a, b) => b.数 - a.数);
}

  document.body.classList.add('locked');

  const 直す = () => {
    const 好 = state.選んだ束.size + state.選んだタグ.size;
    const 嫌 = state.嫌いな束.size + state.嫌いなタグ.size;
    document.getElementById('w-done').textContent =
      好 + 嫌 ? `好き${好}・苦手${嫌} で完了` : '選ばずに閉じる';
  };
  // ○ → 好き → 苦手 → ○ の3段階
  const 回す = (好, 嫌, 名) => {
    if (好.has(名)) { 好.delete(名); 嫌.add(名); return '苦手'; }
    if (嫌.has(名)) { 嫌.delete(名); return ''; }
    好.add(名); return '好き';
  };
  el.querySelector('#w-bundles').addEventListener('click', (e) => {
    const b = e.target.closest('.bnd'); if (!b) return;
    const v = 回す(state.選んだ束, state.嫌いな束, b.dataset.b);
    b.dataset.v = v;
    b.querySelector('.tick2').textContent = v === '好き' ? '✓' : v === '苦手' ? '✕' : '○';
    const ct = b.querySelector('.ct');
    ct.textContent = ct.textContent.split('　')[0] + (v ? `　${v === '好き' ? '✓ 好き' : '✕ 苦手'}` : '');
    直す(); 言葉を保存();
  });
  el.querySelector('#w-chips').addEventListener('click', (e) => {
    const c = e.target.closest('.chip'); if (!c) return;
    c.dataset.v = 回す(state.選んだタグ, state.嫌いなタグ, c.dataset.k);
    直す(); 言葉を保存();
  });
  el.querySelector('#w-clear').addEventListener('click', () => {
    state.選んだ束.clear(); state.選んだタグ.clear();
    state.嫌いな束.clear(); state.嫌いなタグ.clear();
    言葉を保存(); paintWords();
  });
  el.querySelector('#w-done').addEventListener('click', closeWords);
}

function 言葉を保存(){
  state.keywordPicks = {
    束: [...state.選んだ束], タグ: [...state.選んだタグ],
    嫌いな束: [...state.嫌いな束], 嫌いなタグ: [...state.嫌いなタグ],
  };
  save('keywordPicks');
}

function openWords(){
  if (!state.束.length){ alert('言葉の束が読み込めませんでした（data/keywords.json）'); return; }
  paintWords();
}

function closeWords(){
  document.getElementById('words').innerHTML = '';
  document.body.classList.remove('locked');
  recomputeTaste();
  render();
  scrollTo({ top: 0, behavior: 'smooth' });
}

/* ───────── 起動 ───────── */
function wireGroup(id, key){
  document.getElementById(id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    for (const x of e.currentTarget.querySelectorAll('button')) x.setAttribute('aria-pressed', String(x === b));
    if (key === 'sort' && b.dataset.v === 'ばらばら' && state.sort === 'ばらばら') state.たね++;  // 押すたび混ぜ直す
    state[key] = b.dataset.v;
    render();
  });
}
function wireToggle(id, key){
  const el = document.getElementById(id);
  el.addEventListener('click', () => {
    state[key] = el.getAttribute('aria-pressed') !== 'true';
    el.setAttribute('aria-pressed', String(state[key]));
    render();
  });
}

async function boot(){
  try {
    const [cat, st] = await Promise.all([
      fetch('data/catalog.json').then(r => r.json()),
      fetch('data/state.json').then(r => r.json()),
    ]);
    const seeds = null;   // ★タネ（6.5MB）は、画面を出してから後ろで読む（下の 遅れて読む()）
    // ★この端末で押したものを、上からかぶせる（サーバーが無いので localStorage が保存先）
    for (const k of ['watchlist','reviews','picks','taste','keywordPicks','notForMe','pvSeen']) {
      try { const v = localStorage.getItem('anime:' + k); if (v != null) st[k] = JSON.parse(v); }
      catch (e) { console.warn('この端末の保存が読めませんでした：' + k, e); }
    }
    if (cat.エラー) throw new Error(cat.エラー);

    state.works = cat.作品;
    state.byId = new Map(cat.作品.map(w => [w.id, w]));
    state.更新 = new Date(cat.更新日時).toLocaleString('ja-JP', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'});
    state.契約 = st.config?.契約している配信 ?? [];
    state.lexicon = st.lexicon ?? {};
    state.seeds = seeds?.作品 ?? [];
    for (const x of st.watchlist ?? []) state.watchlist.set(x.id, x);
    for (const x of st.kaikin ?? [])    if (x.id != null) state.kaikin.set(x.id, x);
    for (const x of st.reviews ?? [])   state.reviews.set(x.id, x);
    for (const x of st.picks ?? [])     state.picks.set(x.id, x);
    for (const x of st.pvSeen ?? [])    state.pvSeen.set(x.id, x);
    for (const x of st.notForMe ?? [])  state.notForMe.set(x.id, x);
    state.人気の扱い = st.config?.人気の扱い ?? 'マイナーを上に';
    state.束 = st.keywords?.束 ?? [];
    state.lineage = st.lineage ?? null;
    for (const x of st.keywordPicks?.束 ?? []) state.選んだ束.add(x);
    for (const x of st.keywordPicks?.タグ ?? []) state.選んだタグ.add(x);
    for (const x of st.keywordPicks?.嫌いな束 ?? []) state.嫌いな束.add(x);
    for (const x of st.keywordPicks?.嫌いなタグ ?? []) state.嫌いなタグ.add(x);

    // 好みは毎回その場で作り直す（reviews と picks があれば、いつでも再現できる）
    state.taste = buildTaste({
      picks:[...state.picks.values()], reviews:[...state.reviews.values()],
      watchlist:[...state.watchlist.values()], notForMe:[...state.notForMe.values()],
      選んだ言葉: 選んだ言葉を集める(), byId: state.byId,
    });

    document.getElementById('loading').hidden = true;
    // ★タネは重いので後回し。届いたら並べ直す（届かなくても、一覧は動いたまま）
    fetch('data/seeds.json').then(r => r.json()).then(s => {
      state.seeds = s['作品'] ?? [];
      render();
    }).catch(e => console.warn('タネが読めませんでした（一覧は動きます）', e));
    document.getElementById('shelves').addEventListener('click', (e) => {
      const b = e.target.closest('.shelf'); if (!b || b.classList.contains('grp')) return;
      state.棚 = b.dataset.k;
      render();
      scrollTo({ top: 0, behavior: 'smooth' });
    });
    wireGroup('f-sort','sort');
    wireToggle('f-watchable','watchable');
    wireToggle('f-mine','mine');
    document.getElementById('f-teach').addEventListener('click', openTeach);
    document.getElementById('f-words').addEventListener('click', openWords);
    const bare = document.getElementById('f-bare');
    bare.addEventListener('click', () => {
      state.bare = bare.getAttribute('aria-pressed') !== 'true';
      bare.setAttribute('aria-pressed', String(state.bare));
      // 絵だけにしたら、並びも「ばらばら」にする（予想させない）
      if (state.bare && state.sort !== 'ばらばら') {
        state.sort = 'ばらばら';
        for (const x of document.querySelectorAll('#f-sort button'))
          x.setAttribute('aria-pressed', String(x.dataset.v === 'ばらばら'));
      }
      render();
    });
    // ⚠️ pvを開く を直接渡すと、クリックの情報が第1引数（帯の中身）として渡ってしまい落ちる。
    //    帯ごとの「続けて観る」を足したときに壊した。必ず包んで呼ぶこと。
    document.getElementById('f-pvtime').addEventListener('click', () => pvを開く());
    // ★この端末で押したものを、Macに戻すための出口。押すと中身が clipboard に入る
    const 持出 = document.getElementById('f-export');
    if (持出) 持出.addEventListener('click', async () => {
      const 束 = {};
      for (const k of ['watchlist','reviews','picks','keywordPicks','notForMe','pvSeen']) {
        const v = localStorage.getItem('anime:' + k);
        if (v != null) 束[k] = JSON.parse(v);
      }
      束.形式 = 'anime-catalog 記録';
      // ★字下げ無しで写す。利用者規模（161作品）で 20万→13万文字。LINEには載らない長さなので、
      //   iPhone→Mac はユニバーサルクリップボードかメモAppで運ぶ
      const 文 = JSON.stringify(束);
      try { await navigator.clipboard.writeText(文); flash('この端末の記録を写しました（' + 文.length + '文字）'); }
      catch (e) { flash('⚠️ 写せませんでした：' + e.message, true); }
    });

    // ★2026-09-28 利用者の指摘→ 残らない。だから入口を作る
    //   別の端末で「📤 記録を写す」した中身を貼ると、この端末の記録に★足す★（上書きではない）。
    //   同じ作品が両方にあれば、貼った方を採る。
    const 読込 = document.getElementById('f-import');
    if (読込) 読込.addEventListener('click', () => {
      const 文 = prompt('別の端末で「📤 記録を写す」した中身を、ここに貼ってください。\nこの端末の記録に足します（消えはしません）');
      if (!文 || !文.trim()) return;
      let 束;
      try { 束 = JSON.parse(文); } catch { flash('⚠️ 読めませんでした。「📤 記録を写す」の中身をそのまま貼ってください', true); return; }
      if (!束 || typeof 束 !== 'object' || Array.isArray(束)) { flash('⚠️ 記録の形ではありませんでした', true); return; }
      const 読む = (k, 既定) => { try { return JSON.parse(localStorage.getItem('anime:' + k)) ?? 既定; } catch { return 既定; } };
      const 報告 = [];
      for (const k of ['watchlist','reviews','picks','notForMe','pvSeen']) {
        if (!Array.isArray(束[k])) continue;
        const 手元 = new Map(読む(k, []).filter(x => x && x.id != null).map(x => [x.id, x]));
        const 前 = 手元.size;
        for (const x of 束[k]) if (x && x.id != null) 手元.set(x.id, x);
        localStorage.setItem('anime:' + k, JSON.stringify([...手元.values()]));
        報告.push(k + ' +' + (手元.size - 前));
      }
      if (束.keywordPicks && typeof 束.keywordPicks === 'object') {
        const 手元 = 読む('keywordPicks', { 束: [], タグ: [] });
        for (const [k, v] of Object.entries(束.keywordPicks)) {
          if (Array.isArray(v)) 手元[k] = [...new Set([...(手元[k] ?? []), ...v])];
        }
        localStorage.setItem('anime:keywordPicks', JSON.stringify(手元));
      }
      if (!報告.length) { flash('⚠️ 足せる記録が入っていませんでした', true); return; }
      // 好み（taste）は起動のたびに picks・★・♥ から作り直されるので、読み直せば効く
      localStorage.removeItem('anime:taste');
      alert('記録を足しました（' + 報告.join('・') + '）。読み直します');
      location.reload();
    });

    const カードを押したら = e => {
      // ★行動ボタンを押したときは、個票を開かない
      const 止 = e.target.closest('[data-stop]');
      if (止) {
        e.stopPropagation();
        const s = 止.dataset.seen;
        if (s) {
          const id = Number(s);
          const w = state.byId.get(id);
          if (state.reviews.has(id)) state.reviews.delete(id);
          else state.reviews.set(id, { id, タイトル: w.タイトル, みた日: today(), '★': 0, 感想: '', レビュー: '' });
          save('reviews'); recomputeTaste(); render();
        }
        return;
      }
      const pv = e.target.closest('.play');
      if (pv) { e.stopPropagation(); return openDetail(Number(pv.dataset.trailer), { 予告編から:true }); }
      const c = e.target.closest('.card');
      if (c) openDetail(Number(c.dataset.id));
    };
    document.getElementById('wall').addEventListener('click', カードを押したら);
    // ★いま開いている棚を、そのまま続けて観る
    document.getElementById('f-shelfplay').addEventListener('click', () => {
      const 名前 = 棚の一覧().find((t) => t.key === state.棚)?.名 ?? '棚';
      const list = visible();
      const 情報 = new Map(list.map((r) => [r.w.id, r]));
      pvを開く({ 名前, 作品: list.map((r) => r.w), 情報 });
    });
    document.getElementById('end').addEventListener('click', e => {
      const b = e.target.closest('[data-end]'); if (!b) return;
      if (b.dataset.end === 'top') return scrollTo({ top:0, behavior:'smooth' });
      // 「拾ったものを見る」＝ ♥みたい・みた だけの絞り込みを入れて、先頭へ
      const t = document.getElementById('f-mine');
      if (t.getAttribute('aria-pressed') !== 'true') t.click();
      scrollTo({ top:0, behavior:'smooth' });
    });
    // △先頭へ ─ 少し下げたら出す。個票や好み画面を開いている間は隠す
    const totop = document.getElementById('totop');
    totop.addEventListener('click', () => scrollTo({ top:0, behavior:'smooth' }));
    const 出し入れ = () => {
      const 開いている = document.body.classList.contains('locked');
      totop.classList.toggle('on', !開いている && scrollY > 600);
    };
    addEventListener('scroll', 出し入れ, { passive:true });
    new MutationObserver(出し入れ).observe(document.body, { attributes:true, attributeFilter:['class'] });
    出し入れ();

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

    render();
  } catch (e) {
    document.getElementById('loading').innerHTML =
      `読み込めませんでした：${esc(e.message)}<br><br>ターミナルで <code>node apps/anime-catalog/src/fetch.mjs</code> を先に動かしてください。`;
  }
}
boot();
</script>
